name: verify-multi-fix

# 在干净 WARP 出口上验证 v0.9.26 的多轮工具调用修复。
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client
      - name: Fix DNS
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "WARP_EXIT=$(curl -s --max-time 10 https://api.ipify.org || echo '?')" | tee -a $GITHUB_STEP_SUMMARY

      - name: Build multi-turn request (with declared tools)
        run: |
          python3 - <<'PY'
          import json
          body = {
            "model": "deepseek-v4.1-flash-free",
            "messages": [
              {"role": "user", "content": "Use web_search to search opencode"},
              {"role": "assistant", "content": None, "tool_calls": [
                {"id": "call_1", "type": "function", "function": {"name": "web_search", "arguments": "{\"query\":\"opencode\"}"}}
              ]},
              {"role": "tool", "tool_call_id": "call_1", "content": "opencode is an AI coding agent"}
            ],
            "stream": False,
            "tools": [
              {"type":"function","function":{"name":"web_search","description":"Search the web.",
                "parameters":{"type":"object","properties":{"query":{"type":"string"}}}}},
              {"type":"function","function":{"name":"read","description":"Read a file.",
                "parameters":{"type":"object","properties":{"path":{"type":"string"}}}}}
            ]
          }
          json.dump(body, open("multi.json","w"), ensure_ascii=False)
          print("built")
          PY

      - name: Start v0.9.26 and test
        run: |
          set +e
          chmod +x bin/zen-direct
          PORT=18081 DIRECT_SIDECAR=off DIRECT_UA="opencode/latest/2.2.5/cli" \
          DIRECT_FREELIMIT_COOLDOWN=0 ZEN_TOOL_CHANNEL=1 \
          HTTPS_PROXY="" HTTP_PROXY="" https_proxy="" http_proxy="" ALL_PROXY="" \
          ./bin/zen-direct > gw.log 2>&1 &
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:18081/health)" = "200" ] && break
            sleep 1
          done
          echo "VER=$(grep -o 'v0.9.26' gw.log | head -1)" | tee -a $GITHUB_STEP_SUMMARY
          code=$(curl -s -o resp.json -w '%{http_code}' --max-time 180 \
            -X POST http://127.0.0.1:18081/v1/chat/completions \
            -H 'Content-Type: application/json' -H 'Authorization: Bearer public' \
            --data-binary @multi.json)
          echo "MULTI_HTTP_CODE=$code" | tee -a $GITHUB_STEP_SUMMARY
          echo "--- response ---" >> $GITHUB_STEP_SUMMARY
          head -c 800 resp.json | tee -a $GITHUB_STEP_SUMMARY
          echo >> $GITHUB_STEP_SUMMARY
