name: prompt-ab

# 同一出口、同一请求形状，对比两种官方 system prompt：
#   A) 我们 v0.9.27+ 抓到的 CLI 2.2.5 原文（95KB）
#   B) opencode2api v1.4.8 用的旧版（8.5KB）
# 网关用 ZEN_PROMPT_FILE 覆盖注入的提示词。
on:
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client
      - name: Fix DNS
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "WARP_EXIT=$(curl -s --max-time 10 https://api.ipify.org || echo '?')" | tee -a $GITHUB_STEP_SUMMARY

      - name: Restore prompts and payload
        run: |
          echo '' | base64 -d > promptA.txt
          echo '' | base64 -d > promptB.txt
          echo '' | base64 -d > req.json
          wc -c promptA.txt promptB.txt req.json

      - name: A (our 95KB prompt) then B (their 8.5KB prompt)
        run: |
          set +e
          for v in A B; do
            chmod +x bin/zen-direct
            if [ "$v" = "A" ]; then PF=promptA.txt; else PF=promptB.txt; fi
            PORT=18081 DIRECT_SIDECAR=off DIRECT_UA="opencode/latest/2.2.5/cli" \
            DIRECT_FREELIMIT_COOLDOWN=0 ZEN_TOOL_CHANNEL=0 ZEN_DESC_VERBATIM=1 \
            ZEN_PROMPT_FILE=$PF \
            HTTPS_PROXY="" HTTP_PROXY="" https_proxy="" http_proxy="" ALL_PROXY="" \
            ./bin/zen-direct > gw-$v.log 2>&1 &
            GW=$!
            for i in $(seq 1 30); do
              [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:18081/health)" = "200" ] && break
              sleep 1
            done
            code=$(curl -s -o out-$v.json -w '%{http_code}' --max-time 120 \
              -X POST http://127.0.0.1:18081/v1/chat/completions \
              -H 'Content-Type: application/json' -H 'Authorization: Bearer public' \
              --data-binary @req.json)
            echo "prompt$v=$code" | tee -a $GITHUB_STEP_SUMMARY
            head -c 160 out-$v.json | tr '\n' ' ' | tee -a $GITHUB_STEP_SUMMARY
            echo | tee -a $GITHUB_STEP_SUMMARY
            kill $GW 2>/dev/null
            sleep 4
          done
