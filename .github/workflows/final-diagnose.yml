name: final-diagnose

# 终局诊断：同一出口上同时发 plain / 45tools / multi 三种请求，
# 用 plain 作出口健康对照，判断 multi 429 是请求形态还是出口。
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client
      - name: Fix DNS
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "WARP_EXIT=$(curl -s --max-time 10 https://api.ipify.org || echo '?')" | tee -a $GITHUB_STEP_SUMMARY

      - name: Build 3 requests
        run: |
          python3 - <<'PY'
          import json
          tools=[{"type":"function","function":{"name":"web_search","description":"Search web.",
                  "parameters":{"type":"object","properties":{"query":{"type":"string"}}}}}]
          json.dump({"model":"deepseek-v4.1-flash-free",
                     "messages":[{"role":"user","content":"say ok"}],"stream":False},
                    open("plain.json","w"))
          json.dump({"model":"deepseek-v4.1-flash-free",
                     "messages":[{"role":"user","content":"search opencode"}],
                     "stream":False,"tools":tools}, open("tools.json","w"))
          json.dump({"model":"deepseek-v4.1-flash-free",
                     "messages":[
                       {"role":"user","content":"search opencode"},
                       {"role":"assistant","content":None,"tool_calls":[
                         {"id":"call_1","type":"function","function":{"name":"web_search","arguments":"{\"query\":\"opencode\"}"}}]},
                       {"role":"tool","tool_call_id":"call_1","content":"opencode is an AI agent"}],
                     "stream":False,"tools":tools}, open("multi.json","w"))
          print("built")
          PY

      - name: Run 3 requests in sequence
        run: |
          set +e
          chmod +x bin/zen-direct
          PORT=18081 DIRECT_SIDECAR=off DIRECT_UA="opencode/latest/2.2.5/cli" \
          DIRECT_FREELIMIT_COOLDOWN=0 \
          HTTPS_PROXY="" HTTP_PROXY="" https_proxy="" http_proxy="" ALL_PROXY="" \
          ./bin/zen-direct > gw.log 2>&1 &
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:18081/health)" = "200" ] && break
            sleep 1
          done
          grep -o 'v0\.9\.[0-9]*' gw.log | head -1 | sed 's/^/VER=/' | tee -a $GITHUB_STEP_SUMMARY
          for t in plain tools multi; do
            code=$(curl -s -o r-$t.json -w '%{http_code}' --max-time 120 \
              -X POST http://127.0.0.1:18081/v1/chat/completions \
              -H 'Content-Type: application/json' -H 'Authorization: Bearer public' \
              --data-binary @$t.json)
            echo "$t=$code" | tee -a $GITHUB_STEP_SUMMARY
            head -c 120 r-$t.json | tr '\n' ' ' | tee -a $GITHUB_STEP_SUMMARY
            echo | tee -a $GITHUB_STEP_SUMMARY
            sleep 3
          done
