name: vpngate-direct

# VPNGate 住宅出口实测（对齐模板用法）：
# sing-box mixed 代理 127.0.0.1:18080，zen-direct 经 HTTPS_PROXY 走该出口。
on:
  workflow_dispatch:

jobs:
  vg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install sing-box
        run: |
          V=1.11.3
          curl -fsSL -o /tmp/sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${V}/sing-box-${V}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tgz -C /tmp
          sudo install -m755 "/tmp/sing-box-${V}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Fix DNS
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "RAW_EXIT=$(curl -s --max-time 10 https://api.ipify.org || echo '?')" | tee -a $GITHUB_STEP_SUMMARY

      - name: Probe and select VPNGate node
        run: |
          curl -s --compressed -m 30 -o /tmp/vg.csv "https://www.vpngate.net/api/iphone/" || true
          wc -l /tmp/vg.csv || true
          chmod +x bin/zen-direct
          python3 scripts/probe_and_select_vpngate.py --csv /tmp/vg.csv --output /tmp/sb.json \
            --zen-bin bin/zen-direct --concurrency 20 --max-candidates 35 --keep-nodes 3 \
            --mixed-port 18080 || true
          if [ -s /tmp/sb.json ]; then
            sing-box run -c /tmp/sb.json > /tmp/singbox.log 2>&1 &
            for i in $(seq 1 60); do
              if (exec 3<>/dev/tcp/127.0.0.1/18080) 2>/dev/null; then exec 3>&-; break; fi
              sleep 0.5
            done
            echo "sing-box mixed port up"
          else
            echo "NO_NODE: 未筛选出可用节点" | tee -a $GITHUB_STEP_SUMMARY
            tail -20 /tmp/singbox.log 2>/dev/null || true
          fi

      - name: Verify VPNGate exit
        run: |
          set +e
          for i in 1 2 3; do
            IP=$(curl -s -x http://127.0.0.1:18080 --max-time 15 https://api.ipify.org || echo '')
            [ -n "$IP" ] && break
            sleep 3
          done
          echo "VPN_EXIT=$IP" | tee -a $GITHUB_STEP_SUMMARY

      - name: Start gateway through VPNGate
        run: |
          chmod +x bin/zen-direct
          PORT=18081 DIRECT_SIDECAR=off DIRECT_UA="opencode/latest/2.2.5/cli" \
          DIRECT_FREELIMIT_COOLDOWN=0 ZEN_TOOL_CHANNEL=1 \
          HTTPS_PROXY="http://127.0.0.1:18080" HTTP_PROXY="http://127.0.0.1:18080" \
          ./bin/zen-direct > gw.log 2>&1 &
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:18081/health)" = "200" ] && break
            sleep 1
          done
          grep -o 'v0\.9\.[0-9]*' gw.log | head -1 | sed 's/^/VER=/' | tee -a $GITHUB_STEP_SUMMARY

      - name: Run 4 requests
        run: |
          set +e
          python3 - <<'PY'
          import json
          names = ["pwsh","read","write","edit","glob","grep","skill","subagent",
                   "web_search","web_fetch","team_task_create","team_task_list",
                   "send_message","spawn_teammate","list_agents","todo_write","workflow"]
          tools = [{"type":"function","function":{"name":n,"description":"Tool "+n+".",
                    "parameters":{"type":"object","properties":{"query":{"type":"string"}}}}} for n in names]
          json.dump({"model":"deepseek-v4.1-flash-free",
                     "messages":[{"role":"user","content":"say ok"}],"stream":False},
                    open("plain.json","w"))
          json.dump({"model":"deepseek-v4.1-flash-free",
                     "messages":[{"role":"user","content":"search opencode"}],
                     "stream":False,"tools":tools}, open("tools.json","w"))
          json.dump({"model":"deepseek-v4.1-flash-free",
                     "messages":[
                       {"role":"user","content":"search opencode"},
                       {"role":"assistant","content":None,"tool_calls":[
                         {"id":"call_1","type":"function","function":{"name":"web_search","arguments":"{\"query\":\"opencode\"}"}}]},
                       {"role":"tool","tool_call_id":"call_1","content":"opencode is an AI agent"}],
                     "stream":False,"tools":tools}, open("multi.json","w"))
          names45 = names + ["team_task_update","team_task_get","interrupt_agent","wait_agent",
                     "create_goal","update_goal","schedule_create","schedule_delete",
                     "schedule_list","schedule_update","ask_user_question","read_image",
                     "dsh_im_group_file","dsh_im_group_history","dsh_im_return_file",
                     "exit_plan_mode","present","purge_apply","purge_revert","purge_status",
                     "anysearch_search","anysearch_batch_search","anysearch_capabilities",
                     "job_kill","job_list","job_output"]
          t45=[{"type":"function","function":{"name":n,"description":"Tool "+n+".",
                "parameters":{"type":"object","properties":{"query":{"type":"string"}}}}} for n in names45]
          json.dump({"model":"deepseek-v4.1-flash-free",
                     "messages":[{"role":"user","content":"Use web_search to search opencode"}],
                     "stream":False,"tools":t45}, open("req45.json","w"))
          print("built", len(t45))
          PY
          for t in plain tools multi; do
            code=$(curl -s -o r-$t.json -w '%{http_code}' --max-time 180 \
              -X POST http://127.0.0.1:18081/v1/chat/completions \
              -H 'Content-Type: application/json' -H 'Authorization: Bearer public' \
              --data-binary @$t.json)
            echo "$t=$code" | tee -a $GITHUB_STEP_SUMMARY
            head -c 160 r-$t.json | tr '\n' ' ' | tee -a $GITHUB_STEP_SUMMARY
            echo | tee -a $GITHUB_STEP_SUMMARY
            sleep 3
          done
          code=$(curl -s -o r-45.json -w '%{http_code}' --max-time 180 \
            -X POST http://127.0.0.1:18081/v1/chat/completions \
            -H 'Content-Type: application/json' -H 'Authorization: Bearer public' \
            --data-binary @req45.json)
          echo "45tools=$code" | tee -a $GITHUB_STEP_SUMMARY
          head -c 200 r-45.json | tr '\n' ' ' | tee -a $GITHUB_STEP_SUMMARY
          echo | tee -a $GITHUB_STEP_SUMMARY

      - name: Log tail
        if: always()
        run: |
          tail -10 gw.log | tee -a $GITHUB_STEP_SUMMARY || true
          tail -5 /tmp/singbox.log 2>/dev/null | tee -a $GITHUB_STEP_SUMMARY || true
